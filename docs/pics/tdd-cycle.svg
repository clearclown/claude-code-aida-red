<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" fill="#1a1a2e"/>

  <!-- Circle path -->
  <circle cx="150" cy="150" r="80" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="5,5"/>

  <!-- RED -->
  <g transform="translate(150, 70)">
    <circle cx="0" cy="0" r="35" fill="#e74c3c" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">RED</text>
    <text x="0" y="55" text-anchor="middle" fill="#e74c3c" font-family="Arial" font-size="10">Write Test</text>
  </g>

  <!-- Arrow RED to GREEN -->
  <path d="M 185 85 Q 220 120 215 160" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- GREEN -->
  <g transform="translate(220, 190)">
    <circle cx="0" cy="0" r="35" fill="#2ecc71" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="bold">GREEN</text>
    <text x="0" y="55" text-anchor="middle" fill="#2ecc71" font-family="Arial" font-size="10">Make Pass</text>
  </g>

  <!-- Arrow GREEN to REFACTOR -->
  <path d="M 185 210 Q 150 240 110 210" stroke="#888" stroke-width="2" fill="none"/>

  <!-- REFACTOR -->
  <g transform="translate(80, 190)">
    <circle cx="0" cy="0" r="35" fill="#3498db" filter="url(#glow)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">REFACTOR</text>
    <text x="0" y="55" text-anchor="middle" fill="#3498db" font-family="Arial" font-size="10">Clean Up</text>
  </g>

  <!-- Arrow REFACTOR to RED -->
  <path d="M 85 155 Q 80 120 115 85" stroke="#888" stroke-width="2" fill="none"/>

  <!-- Center text -->
  <text x="150" y="155" text-anchor="middle" fill="#666" font-family="Arial" font-size="11">TDD Cycle</text>
</svg>
