<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120">
  <defs>
    <linearGradient id="phase1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#feca57"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#feca57"/>
      <stop offset="100%" style="stop-color:#48dbfb"/>
    </linearGradient>
    <linearGradient id="phase3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48dbfb"/>
      <stop offset="100%" style="stop-color:#ff9ff3"/>
    </linearGradient>
    <linearGradient id="phase4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9ff3"/>
      <stop offset="100%" style="stop-color:#54a0ff"/>
    </linearGradient>
    <linearGradient id="phase5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#54a0ff"/>
      <stop offset="100%" style="stop-color:#5f27cd"/>
    </linearGradient>
    <filter id="shadowSmall" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="120" fill="#1a1a2e"/>

  <!-- Phase 1 -->
  <g transform="translate(70, 50)">
    <circle cx="0" cy="0" r="35" fill="url(#phase1)" filter="url(#shadowSmall)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">1</text>
    <text x="0" y="75" text-anchor="middle" fill="#eee" font-family="Arial" font-size="9">Extraction</text>
  </g>

  <!-- Arrow -->
  <path d="M 110 50 L 140 50" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Phase 2 -->
  <g transform="translate(210, 50)">
    <circle cx="0" cy="0" r="35" fill="url(#phase2)" filter="url(#shadowSmall)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">2</text>
    <text x="0" y="75" text-anchor="middle" fill="#eee" font-family="Arial" font-size="9">Structure</text>
  </g>

  <!-- Arrow -->
  <path d="M 250 50 L 280 50" stroke="#666" stroke-width="2" fill="none"/>

  <!-- Phase 3 -->
  <g transform="translate(350, 50)">
    <circle cx="0" cy="0" r="35" fill="url(#phase3)" filter="url(#shadowSmall)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">3</text>
    <text x="0" y="75" text-anchor="middle" fill="#eee" font-family="Arial" font-size="9">Alignment</text>
  </g>

  <!-- Arrow -->
  <path d="M 390 50 L 420 50" stroke="#666" stroke-width="2" fill="none"/>

  <!-- Phase 4 -->
  <g transform="translate(490, 50)">
    <circle cx="0" cy="0" r="35" fill="url(#phase4)" filter="url(#shadowSmall)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">4</text>
    <text x="0" y="75" text-anchor="middle" fill="#eee" font-family="Arial" font-size="9">Verification</text>
  </g>

  <!-- Arrow -->
  <path d="M 530 50 L 560 50" stroke="#666" stroke-width="2" fill="none"/>

  <!-- Phase 5 -->
  <g transform="translate(630, 50)">
    <circle cx="0" cy="0" r="35" fill="url(#phase5)" filter="url(#shadowSmall)"/>
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold">5</text>
    <text x="0" y="75" text-anchor="middle" fill="#eee" font-family="Arial" font-size="9">Implementation</text>
  </g>
</svg>
